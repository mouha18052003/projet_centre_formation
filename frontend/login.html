<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <div class="container">
            <div class="row mt-5">
                <div class="col-lg-4 bg-white m-auto rounded-top">
                    <h3 class="text-center text-primary">Connexion</h3>
                    <form id="loginForm">

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-envelope fa-fw"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="Email" required>
                        </div>


                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-lock fa-fw"></i></span>
                            <input type="password" class="form-control" id="mot_de_passe" placeholder="Mot de pass" required>
                        </div>

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-success">Se conecter</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

  
        <script src="assets/js/authGuard.js"></script>
        <script src="../assets/js/main.js"></script>
    <script src="../assets/js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>
</html>
