<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
     <div class="container">
            <div class="row mt-5">
                <div class="col-lg-4 bg-white m-auto rounded-top">
                    <h2 class="text-center text-primary">S'inscrire</h2>
                    <form id="apprenantForm">
                        <input type="hidden" id="id_apprenant">

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-user fa-fw"></i></span>
                            <input type="text" class="form-control" id="prenom" placeholder="Prenom" required>
                        </div>


                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-user fa-fw"></i></span>
                            <input type="text" class="form-control" id="nom" placeholder="Nom" required>
                        </div>


                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-calendar-days fa-fw"></i></span>
                            <input type="date" class="form-control" id="date_naissance" placeholder="jj/mm/aaaa" required>
                        </div>


                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-phone fa-fw"></i></span>
                            <input type="tel" class="form-control" id="telephone" placeholder="Telephone">
                        </div>

                         <div class=" input-group">
                        <span class="input-group-text"><i class="fa-solid fa-folder fa-fw"></i></span>
                        <select class="form-select" id="id_session" ></select>
                    </div>



                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-envelope fa-fw"></i></span>
                            <input type="email" class="form-control" id="adress_email" placeholder="Email">
                        </div>


                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-lock fa-fw"></i></span>
                            <input type="password" class="form-control" id="mot_de_passe" placeholder="Mot de pass">
                        </div>

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-success">Je m'inscrits</button>
                        </div>
                    </form>

                    <div class="link_loggin">
                        <h6 class="text-center">vous avez deja un compte ?
                        <a href="login.html">se connecter</a>
                        </h6>
                    </div>

                </div>
            </div>
        </div>
</body>
</html>
