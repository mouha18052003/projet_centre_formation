<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscriptions</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>
<body>
     <!-- c'est le div ou la navbar sera charger -->
    <div id="monNavbar"></div> 

    <div class="container">
        <div class="row mt-5">
            <div class="col-lg-4 bg-white m-auto rounded-top">
                <h2 class="text-center text-primary">Ajouter une inscription</h2>
                <form id="inscriptionForm">
                    <input type="hidden" id="id_inscription">


                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <select id="id_apprenant" class="form-select"></select>
                    </div>


                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-folder fa-fw"></i></span>
                        <select id="id_session" class="form-select"></select><!--type d'input qui permet un deroulant des elements-->
                    </div>
                    <!--ici pas besoin de remplir la date_inscription le backend s'en chargera -->

                     <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-success">J'ajoute</button>
                        </div>
                </form>
            </div>
        </div>
    </div>


    <!--liste des inscription des apprenants-->
    <div class="container">
        <div class="row mt-5">
            <div class="col-lg-8 bg-white m-auto rounded-top">
                <h3 class="text-center  text-primary">Liste des inscriptions</h3>
                <table class="table table-bordered table-hover table-striped">
                    <thead class="table-dark">
                        <tr>
                        <th>id</th>
                        <th>apprenant</th>
                        <th>session</th>
                        <th>date_inscription</th>
                        <th>action</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyInscription"></tbody>
                </table>
            </div>
        </div>
    </div>




    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/inscription.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    
</body>
</html>
