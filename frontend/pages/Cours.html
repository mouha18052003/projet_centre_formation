<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
     <!-- c'est le div ou la navbar sera charger -->
    <div id="monNavbar"></div> 

    <div class="container">
        <div class="row mt-5">
            <div class="col-lg-4 bg-white m-auto rounded-top">
                <h2 class="text-center text-primary">Planifier un cours</h2>
                <form id="coursForm">
                    <input type="hidden" id="id_cours">


                    <div class=" input-group">
                        <span class="input-group-text"><i class="fa-solid fa-folder fa-fw"></i></span>
                        <select class="form-select" id="id_session" ></select>
                    </div>


                    <div class=" input-group">
                        <span class="input-group-text"><i class="fa-solid fa-folder fa-fw"></i></span>
                        <select class="form-select" id="id_module" ></select>
                    </div>


                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user fa-fw"></i></span>
                        <select class="form-select" id="id_formateur" ></select>
                    </div>


                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-house fa-fw"></i></span>
                        <select class="form-select" id="id_salle"></select>
                    </div>


                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-regular fa-clock fa-fw"></i></span>
                        <input type="time" class="form-control" id="heure_debut">
                    </div>


                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-regular fa-clock fa-fw"></i></span>
                        <input type="time" class="form-control" id="heure_fin" >
                    </div>

                     <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-calendar-days fa-fw"></i></span>
                        <input type="date" class="form-control" id="date_cours" >
                    </div>


                    <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-success">Je planifie</button>
                        </div>
                </form>
            </div>
        </div>
    </div>


    <!--liste des cours planifiers-->
    <div class="container">
        <div class="row mt-5">
            <div class="col-lg-12 bg-white m-auto rounded-top">
                <h3 class="text-center text-primary">liste des cours planifes</h3>
                <table class="table table-bordered table-hover table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>id</th>
                            <th>session</th>
                            <th>module</th>
                            <th>formateur</th>
                            <th>salle</th>
                            <th>debut</th>
                            <th>fin</th>
                            <th>date</th>
                            <th>action</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyCours"></tbody>
                </table>
            </div>
        </div>
    </div>




    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/cours.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    
</body>
</html>
